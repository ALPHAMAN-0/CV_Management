services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cvplatform
      POSTGRES_USER: cvplatform
      POSTGRES_PASSWORD: cvplatform
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvplatform -d cvplatform"]
      interval: 5s
      retries: 10

  # Runs the production image locally: `docker compose up --build web`.
  web:
    build: .
    profiles: [app]
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Database=cvplatform;Username=cvplatform;Password=cvplatform"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
